# .github/workflows/build.yml - Fix polkit-gnome per Fedora 44
name: Build CulOS Immutable Image & Bootable ISO
on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: culos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-image:
    name: Build OCI OS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata tags for OCI Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and Push OCI Image Layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,squash=true

  build-iso:
    name: Generate Bootable ISO Installation Media
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Create ISO Output Directory
        run: mkdir -p ./iso-output

      - name: Generate Bare-Metal Installer ISO for Fedora 44
        # Eseguiamo il container iniettando un comando preliminare per rimuovere il pacchetto deprecato polkit-gnome
        run: |
          docker run --rm --privileged \
            -v .:/isogenerator/output \
            -e VERSION=44 \
            -e IMAGE_NAME=${{ env.IMAGE_NAME }} \
            -e IMAGE_TAG=latest \
            -e IMAGE_REPO=${{ env.IMAGE_REGISTRY }} \
            -e VARIANT=Kinoite \
            --entrypoint /bin/bash \
            ghcr.io/ublue-os/isogenerator:latest \
            -c "sed -i '/polkit-gnome/d' /usr/share/lorax/templates.d/99-generic/runtime-install.tmpl && /isogenerator/scripts/build-iso.sh"

      - name: Move generated ISO to artifact path
        run: |
          mkdir -p ./iso-target
          mv *.iso ./iso-target/ || true

      - name: Upload Bootable CulOS Installation Media Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CulOS-Kinoite-44-Installation-ISO
          path: ./iso-target/*.iso
          retention-days: 14
