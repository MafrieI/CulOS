name: Crea Installer CulOS
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: culos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # STEP 1: Questo salva i file pesanti di CulOS sul tuo profilo GitHub (Funziona già)
  build-image:
    name: Salva file di sistema CulOS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Preleva i file
        uses: actions/checkout@v4

      - name: Configura Docker
        uses: docker/setup-buildx-action@v3

      - name: Accedi a GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepara Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Compila e Salva online
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,squash=true

  # STEP 2: Questo crea la ISO leggera con le istruzioni da scaricare
  build-iso:
    name: Crea ISO Leggera da scaricare
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Preleva i file
        uses: actions/checkout@v4

      - name: Prepara cartella di uscita
        run: mkdir -p ./output-culos

      - name: Scarica ISO leggera ufficiale Fedora
        run: |
          wget -O ./output-culos/CulOS-Installatore-Leggero.iso https://fedoraproject.org

      - name: Crea il foglio di istruzioni per il tuo PC
        run: |
          cat <<EOF > ./output-culos/istruzioni_installazione.ks
          text
          keyboard --vckeymap=it --layout=it
          lang it_IT.UTF-8
          timezone Europe/Rome --utc
          rootpw --lock
          user --name=culos --groups=wheel
          ostreecontainer --url=ostree:image/docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          clearpart --all --initlabel
          autopart --type=plain
          reboot
          EOF

      - name: Impacchetta tutto in un file ZIP
        run: |
          zip -r ./CulOS-Pacchetto-Installazione.zip ./output-culos/*

      - name: Invia lo ZIP negli Artifacts di GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CulOS-Pronto-Da-Scaricare
          path: ./CulOS-Pacchetto-Installazione.zip
          retention-days: 14
