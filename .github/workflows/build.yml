# .github/workflows/build.yml - Versione nativa Fedora per evitare incompatibilità Ubuntu
name: Build CulOS Immutable Image & Bootable ISO
on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: culos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-image:
    name: Build OCI OS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata tags for OCI Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and Push OCI Image Layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,squash=true

  build-iso:
    name: Generate Bootable ISO Installation Media
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
      options: --privileged
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install Fedora Native ISO Generation Tools
        run: |
          dnf install -y lorax wget xorriso squashfs-tools

      - name: Download Official Fedora Kinoite 44 Base ISO
        run: |
          mkdir -p ./iso-working
          wget -q --show-progress -O ./iso-working/fedora-kinoite-base.iso https://fedoraproject.org

      - name: Create Kickstart Configuration for CulOS
        run: |
          cat <<EOF > ./iso-working/culos.ks
          text
          keyboard --vckeymap=it --layout=it
          lang it_IT.UTF-8
          timezone Europe/Rome --utc
          rootpw --lock
          user --name=culos --groups=wheel
          ostreecontainer --url=ostree:image/docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          clearpart --all --initlabel
          autopart --type=plain
          reboot
          EOF

      - name: Inject CulOS Configurations into ISO via Native Mkksiso
        run: |
          # Generiamo la ISO direttamente nel workspace principale di GitHub
          mkksiso ./iso-working/culos.ks ./iso-working/fedora-kinoite-base.iso ./CulOS-Kinoite-44-Installation.iso

      - name: Fix File Permissions for GitHub Runner
        # CRUCIALE: Ripristina i permessi di lettura per l'utente non-root di GitHub Actions, altrimenti l'uploader non legge i GB di dati
        run: |
          chmod 644 ./CulOS-Kinoite-44-Installation.iso
          chown 1001:1001 ./CulOS-Kinoite-44-Installation.iso

      - name: Upload Bootable CulOS Installation Media Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CulOS-Kinoite-44-Installation-ISO
          path: CulOS-Kinoite-44-Installation.iso
          retention-days: 14
          if-no-files-found: error
