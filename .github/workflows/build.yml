# .github/workflows/build.yml - Versione Nativa Blindata contro blocchi di rete
name: Build CulOS Immutable Image & Bootable ISO
on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: culos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-image:
    name: Build OCI OS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata tags for OCI Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and Push OCI Image Layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,squash=true

  build-iso:
    name: Generate Bootable ISO Installation Media
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Fix Runner Network DNS Parameters
        # Forza i DNS di Google sul runner per evitare l'errore "No address associated with hostname"
        run: |
          sudo chmod 777 /etc/resolv.conf
          echo "nameserver 8.8.8.8" > /etc/resolv.conf
          echo "nameserver 8.8.4.4" >> /etc/resolv.conf

      - name: Install ISO Generation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools wget lorax isolinux

      - name: Download Official Fedora Kinoite 44 Base ISO
        run: |
          mkdir -p ./iso-working
          wget -q --show-progress -O ./iso-working/fedora-kinoite-base.iso https://fedoraproject.org

      - name: Create Kickstart Configuration for CulOS
        run: |
          cat <<EOF > ./iso-working/culos.ks
          text
          keyboard --vckeymap=it --layout=it
          lang it_IT.UTF-8
          timezone Europe/Rome --utc
          rootpw --lock
          user --name=culos --groups=wheel
          ostreecontainer --url=ostree:image/docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          clearpart --all --initlabel
          autopart --type=plain
          reboot
          EOF

      - name: Inject CulOS Configurations into ISO via Native Mkksiso
        run: |
          # Chiamiamo lo strumento mkksiso nativo già presente nel sistema operativo
          sudo mkksiso ./iso-working/culos.ks ./iso-working/fedora-kinoite-base.iso ./CulOS-Kinoite-44-Installation.iso

      - name: Upload Bootable CulOS Installation Media Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CulOS-Kinoite-44-Installation-ISO
          path: ./CulOS-Kinoite-44-Installation.iso
          retention-days: 14
