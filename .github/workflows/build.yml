name: Build CulOS Immutable Image & Bootable ISO
on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: culos
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-image:
    name: Build OCI OS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata tags for OCI Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and Push OCI Image Layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Riduciamo l'output finale a un unico strato compatto
          outputs: type=docker,squash=true

  build-iso:
    name: Generate Bootable ISO Installation Media
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Generate Bare-Metal Installer ISO
        uses: ublue-os/isogenerator@main
        with:
          image-name: ${{ env.IMAGE_NAME }}
          installer-repo: fedora-silverblue
          installer-major-version: 44
          image-repo: ${{ env.IMAGE_REGISTRY }}
          variant: 'Kinoite'
          image-tag: 'latest'

      - name: Upload Bootable CulOS Installation Media Artifact
        uses: actions/artifacts-upload@v4
        with:
          name: CulOS-Kinoite-44-Installation-ISO
          path: ./iso-output/*.iso
          retention-days: 14
