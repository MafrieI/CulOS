name: Build CulOS image and ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: culos
  FEDORA_VERSION: 44
  #IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_REGISTRY: ghcr.io/mafriei

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU and Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push CulOS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FEDORA_VERSION }}

  build-iso:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: fedora:39
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install lorax, pykickstart, curl
        run: |
          dnf install -y lorax pykickstart curl

      - name: Download Fedora 44 installer ISO
        run: |
          curl -L \
            "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Workstation/x86_64/iso/Fedora-Workstation-Live-44-1.7.x86_64.iso" \
            -o Fedora-44-installer.iso

      - name: Validate CulOS Kickstart
        run: |
          ksvalidator culos.ks || exit 1

      - name: Generate CulOS ISO with mkksiso
        run: |
          mkksiso --ks culos.ks Fedora-44-installer.iso CulOS-44-installer.iso

      - name: Upload CulOS ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CulOS-44-installer
          path: CulOS-44-installer.iso
